llm:
  vendors:
    anthropic:
      type: anthropic
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 60s
  profiles:
    assistant:
      vendor: anthropic
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
      max-tokens: 200
  # Check the vendor's price page before trusting these: the library ships none on purpose.
  prices:
    anthropic:
      claude-haiku-4-5:
        input-per-million: 1.00
        output-per-million: 5.00
